; PlatformIO Project Configuration File
; Moon Patrol iBooster DAQ — ESP32 CAN sniffer + pressure logger

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    coryjfowler/mcp_can@^1.5.1
    adafruit/Adafruit ADS1X15@^2.5.0

check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,style,performance,portability --suppress=unusedFunction --inline-suppr --std=c++11
check_skip_packages = yes

[env:native]
platform = native
test_build_src = false
lib_deps = throwtheswitch/Unity@^2.6.0
build_flags = -std=c++11
